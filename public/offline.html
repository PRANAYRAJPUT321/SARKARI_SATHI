<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Sarkari Sathi</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f6fa; color: #0b0b0b; text-align: center; padding: 24px; }
  @media (prefers-color-scheme: dark) { body { background: #0d0d0d; color: #fff; } }
  img { width: 72px; height: 72px; }
  button { margin-top: 16px; padding: 10px 18px; border-radius: 12px; border: 0; background: #4f46e5; color: #fff; font-weight: 700; font-size: 15px; }
  p { opacity: .75; max-width: 320px; }
</style>
</head>
<body>
  <div>
    <img src="/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Sarkari Sathi needs an internet connection to load tests and save your progress. Revise your notes and try again in a moment.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
